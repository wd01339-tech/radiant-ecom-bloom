<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Commerce - Global Marketplace for Quality Products</title>
    <meta name="description" content="Discover premium products from trusted sellers worldwide. Shop with confidence, read verified reviews, and enjoy fast global shipping on our secure e-commerce platform." />
    <meta name="keywords" content="e-commerce, online shopping, premium products, global marketplace, verified reviews, secure payments" />
    <meta name="author" content="Premium Commerce" />
    <link rel="canonical" href="https://premium-commerce.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://premium-commerce.com" />
    <meta property="og:title" content="Premium Commerce - Global Marketplace for Quality Products" />
    <meta property="og:description" content="Discover premium products from trusted sellers worldwide. Shop with confidence with verified reviews and secure payments." />
    <meta property="og:image" content="https://premium-commerce.com/og-image.jpg" />
    <meta property="og:site_name" content="Premium Commerce" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://premium-commerce.com" />
    <meta name="twitter:title" content="Premium Commerce - Global Marketplace" />
    <meta name="twitter:description" content="Discover premium products from trusted sellers worldwide. Shop with confidence with verified reviews." />
    <meta name="twitter:image" content="https://premium-commerce.com/twitter-card.jpg" />

    <!-- Structured Data for E-commerce -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Premium Commerce",
      "url": "https://premium-commerce.com",
      "logo": "https://premium-commerce.com/logo.png",
      "description": "Global marketplace for premium products with verified reviews",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-555-PREMIUM",
        "contactType": "Customer Service"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
